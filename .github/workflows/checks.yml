name: Contrôles

# Sur les pull requests, et sur main hors des commits du robot.
#
# paths-ignore couvre TOUT ce que le robot pousse : feed.json, sa version
# allégée, et depuis le 22/09/2026 les fichiers mensuels de docs/archives/.
# Il les committe ensemble, et paths-ignore ne saute un push que si TOUS les
# chemins modifiés y figurent : en oublier un seul rend le filtre inopérant.
# C'est déjà arrivé une fois, avec feed-recent.json, et l'ajout de l'archive
# aurait reproduit la même chose à l'identique.
#
# Aujourd'hui il ne sert de toute façon à rien : GitHub ne déclenche aucun
# workflow sur un push signé par le GITHUB_TOKEN d'un autre workflow, ce qui
# est le cas du robot. Le filtre reste le filet si le robot passait un jour
# à un jeton personnel — sinon ces contrôles partiraient ~48 fois par jour
# pour revérifier du code qui n'a pas bougé.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/feed.json"
      - "docs/feed-recent.json"
      - "docs/archives/**"

# Ces contrôles ne font que lire le dépôt et lancer des scripts : aucun
# besoin d'écrire. Déclaré explicitement plutôt que laissé au réglage par
# défaut du dépôt, qui peut changer sans qu'on s'en aperçoive.
permissions:
  contents: read

# Un push qui en suit un autre de près rend le premier sans objet : ses
# contrôles portent sur du code déjà remplacé. On annule l'exécution en
# cours plutôt que de la laisser finir — l'inverse exact du choix fait pour
# update-feeds, et pour la raison inverse : là-bas une exécution abandonnée
# perdrait des articles, ici elle ne perd qu'un verdict périmé.
#
# Le groupe inclut la ref : deux branches différentes ne doivent pas
# s'annuler l'une l'autre.
concurrency:
  group: controles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Dates, tri, plafonnement, repasse rétroactive, et surtout la fusion
      # après conflit de push — c'est elle qui décide si des articles sont
      # perdus quand deux exécutions se chevauchent.
      - name: Tests du pipeline de données
        run: python test_pipeline.py

      # Empêche la liste des sources et les 139 mots-clés de diverger en
      # silence entre le backend Python et le mode de secours du tracker,
      # comme c'était arrivé sur trois sources fin août 2026.
      - name: Synchronisation backend / mode de secours
        run: python check_sources_sync.py

      # Audit des DONNÉES publiées, pas du code. Volontairement sans
      # `--strict` : ces anomalies sont des symptômes qui peuvent être
      # légitimes ou déjà connus (un site qui republie un article sous deux
      # URL n'est pas un bug du robot). Bloquer les PR dessus rendrait
      # l'outil insupportable et on finirait par l'ignorer — il est là pour
      # être LU dans le journal de la CI, pas pour barrer la route.
      # Le navigateur est installé SÉPARÉMENT du paquet : pip pose la
      # bibliothèque, pas le Chromium qu'elle pilote. `--only-shell` prend la
      # variante sans interface, deux fois plus légère à télécharger et
      # suffisante ici — on ne regarde jamais l'écran, on mesure.
      # Playwright vit dans requirements-dev.txt et non requirements.txt :
      # ce dernier est installé par le robot à chaque passage, et il n'a
      # aucun usage d'un navigateur.
      - name: Installer les dépendances des contrôles rendus
        run: pip install -r requirements-dev.txt

      # Le navigateur s'installe SÉPARÉMENT du paquet : pip pose la
      # bibliothèque, pas le Chromium qu'elle pilote. `--only-shell` prend la
      # variante sans interface, plus légère à télécharger et suffisante ici —
      # on ne regarde jamais l'écran, on mesure.
      - name: Installer le navigateur de test
        run: python -m playwright install --with-deps --only-shell chromium

      # Ce que la lecture du code ne peut pas voir : un `hidden` battu par un
      # `display:grid`, une entête collante qui recouvre son contenu, un
      # libellé décentré de huit pixels. Quatre défauts de ce genre ont été
      # trouvés le 16/09/2026, dont deux rendaient l'app pire qu'avant.
      - name: Contrôles rendus dans un navigateur
        run: python test_navigateur.py

      - name: Audit des données publiées
        run: python audit_donnees.py
