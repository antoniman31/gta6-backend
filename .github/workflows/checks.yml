name: Contrôles

# Sur les pull requests, et sur main hors des commits du robot.
#
# paths-ignore couvre les DEUX fichiers que le robot pousse. Il les committe
# ensemble (feed.json et sa version allégée), et paths-ignore ne saute un
# push que si TOUS les chemins modifiés y figurent : n'en lister qu'un
# rendait le filtre inopérant.
#
# Aujourd'hui il ne sert de toute façon à rien : GitHub ne déclenche aucun
# workflow sur un push signé par le GITHUB_TOKEN d'un autre workflow, ce qui
# est le cas du robot. Le filtre reste le filet si le robot passait un jour
# à un jeton personnel — sinon ces contrôles partiraient ~48 fois par jour
# pour revérifier du code qui n'a pas bougé.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/feed.json"
      - "docs/feed-recent.json"

jobs:
  controles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Dates, tri, plafonnement, repasse rétroactive, et surtout la fusion
      # après conflit de push — c'est elle qui décide si des articles sont
      # perdus quand deux exécutions se chevauchent.
      - name: Tests du pipeline de données
        run: python test_pipeline.py

      # Empêche la liste des sources et les 139 mots-clés de diverger en
      # silence entre le backend Python et le mode de secours du tracker,
      # comme c'était arrivé sur trois sources fin août 2026.
      - name: Synchronisation backend / mode de secours
        run: python check_sources_sync.py

      # Audit des DONNÉES publiées, pas du code. Volontairement sans
      # `--strict` : ces anomalies sont des symptômes qui peuvent être
      # légitimes ou déjà connus (un site qui republie un article sous deux
      # URL n'est pas un bug du robot). Bloquer les PR dessus rendrait
      # l'outil insupportable et on finirait par l'ignorer — il est là pour
      # être LU dans le journal de la CI, pas pour barrer la route.
      - name: Audit des données publiées
        run: python audit_donnees.py
