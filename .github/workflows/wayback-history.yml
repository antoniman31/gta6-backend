name: Récupérer l'historique depuis 2022 (Wayback Machine)

# Ce workflow ne se lance JAMAIS automatiquement (pas de "schedule" ici,
# contrairement à update-feeds.yml) — uniquement à la demande, depuis
# l'onglet Actions, et normalement une seule fois.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wayback:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer l'historique Wayback Machine
        run: python fetch_wayback_history.py

      - name: Publier le résultat
        run: |
          git config --global user.name "GTA6 Watch Bot"
          git config --global user.email "actions@github.com"
          git add docs/feed.json
          git diff --quiet --cached || git commit -m "Ajout de l'historique Wayback Machine"
          git push
