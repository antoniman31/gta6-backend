name: Sonder des flux candidats

# Manuel uniquement. Cette sonde ne sert qu'à décider du remplacement des
# flux rss.app : on la lance, on lit le résultat, on tranche. Aucune raison
# qu'elle tourne toute seule.
#
# Elle vit ici plutôt qu'en local parce que les runners GitHub ont un accès
# réseau complet : depuis certains environnements de développement, toutes
# les URL testées répondent « injoignable » et le bilan ne veut rien dire.
on:
  workflow_dispatch:
    inputs:
      actuels:
        description: "Sonder aussi les flux rss.app actuellement en place"
        type: boolean
        default: true

# Lecture seule : la sonde n'écrit rien, ni dans le dépôt ni ailleurs.
permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Sonder
        run: python sonde_flux.py ${{ inputs.actuels && '--actuels' || '' }}
