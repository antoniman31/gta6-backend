name: Mise à jour des flux GTA 6

on:
  schedule:
    # Un passage par heure, à une minute creuse. Le déclencheur
    # `schedule` de GitHub Actions est best-effort : les runs sont retardés
    # (10 à 35 min observées) et purement abandonnés en période de charge,
    # et la minute 0 est la plus congestionnée de l'heure. Entre le 26 et le
    # 28/08 2026, la cadence réelle était tombée à un run toutes les 3 à 9h
    # avec "0 * * * *". Doubler les tentatives à des minutes décalées ne
    # supprime pas les abandons — c'est un contournement, pas un correctif —
    # mais ramène la cadence effective près de l'heure.
    - cron: "37 * * * *"
  workflow_dispatch:
  # Déclenchement par un planificateur EXTERNE (cron-job.org, Cloudflare
  # Workers, n'importe quel cron), via l'API GitHub :
  #   POST /repos/antoniman31/gta6-backend/dispatches
  #   {"event_type": "run-feeds"}
  #
  # Le `schedule` de GitHub reste en place comme filet, mais il est
  # best-effort par conception : GitHub documente que les exécutions
  # planifiées peuvent être retardées et purement abandonnées en période de
  # charge. Un planificateur externe, lui, appelle à l'heure dite et
  # l'exécution part immédiatement. Voir README.
  repository_dispatch:
    types: [run-feeds]

permissions:
  contents: write

# Empêche deux exécutions de tourner en même temps (ex: une automatique
# horaire + une relance manuelle) — la seconde attend que la première
# termine au lieu de risquer un conflit de push. cancel-in-progress à
# false : on met en file d'attente, on n'interrompt jamais une exécution
# déjà en cours.
#
# Cette file ne suffit cependant pas à elle seule : le run mis en attente a
# été créé avec le SHA du moment de son déclenchement, donc il repart d'un
# dépôt périmé une fois son tour venu. C'est pourquoi le checkout ci-dessous
# force `ref: main` et pourquoi l'étape de publication sait fusionner.
concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # le job dure ~1 min depuis que les sources sont interrogées en parallèle ; large marge de sécurité si un site traîne, sans risquer de tourner indéfiniment
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          # `ref: main` au lieu du SHA figé au déclenchement : un run
          # planifié peut avoir attendu 35 min en file avant de démarrer, et
          # repartirait sinon d'un état du dépôt largement dépassé.
          ref: main

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer et traiter les flux
        run: python fetch_feeds.py
        env:
          # Hors du dépôt : ces fichiers ne doivent jamais pouvoir être committés.
          NEW_ITEMS_FILE: ${{ runner.temp }}/new_items.json
          # Alertes « source tombée / revenue », écrites seulement quand
          # l'état d'une source bascule — donc presque jamais.
          SOURCE_ALERTS_FILE: ${{ runner.temp }}/source_alerts.json
          # Articles déjà connus qui viennent de devenir une actu majeure
          # parce qu'une rédaction de plus les a repris.
          PROMOTED_ITEMS_FILE: ${{ runner.temp }}/promoted_items.json
          # Clé PUBLIQUE : recopiée dans feed.json pour que l'app puisse
          # créer un abonnement push. Aucun risque à l'exposer.
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}

      - name: Publier le résultat
        env:
          NEW_ITEMS_FILE: ${{ runner.temp }}/new_items.json
        run: |
          git config --global user.name "GTA6 Watch Bot"
          git config --global user.email "actions@github.com"

          # Les deux fichiers vont ensemble : l'allégé est ce que l'app
          # charge en premier, publier l'un sans l'autre la laisserait sur
          # un état périmé.
          git add docs/feed.json docs/feed-recent.json
          # Commit systématique, même si generated_at est la seule vraie
          # différence : Git compresse les diffs (delta), donc le coût réel
          # en espace est minime. L'alternative (ignorer generated_at dans
          # la comparaison) casserait l'indicateur de fraîcheur du tracker
          # HTML, qui a justement besoin que ce champ avance à chaque
          # passage pour distinguer "le robot tourne mais ne trouve rien de
          # neuf" de "le robot est en panne".
          if git diff --quiet --cached; then
            echo "Aucune modification à publier."
            exit 0
          fi
          git commit -m "Mise à jour automatique des flux"

          # Boucle de publication résistante aux exécutions concurrentes.
          #
          # docs/feed.json est entièrement régénéré à chaque run : quand deux
          # exécutions se chevauchent, `git pull --rebase` conflicte
          # SYSTÉMATIQUEMENT (les deux côtés ont réécrit les mêmes lignes),
          # s'arrête en conflit, et sous `bash -e` tuait tout le job dès la
          # première tentative — les tentatives suivantes n'étaient jamais
          # atteintes et le travail du run était perdu (runs du 26/08 03:42
          # et du 28/08 07:17).
          #
          # On fusionne donc les deux versions au niveau des DONNÉES via
          # merge_feed.py (union des articles par lien), puis on rejoue le
          # commit par-dessus l'état distant. Aucun article n'est perdu,
          # quel que soit le côté qui l'a trouvé.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Publication réussie (tentative $attempt)."
              exit 0
            fi

            echo "Push rejeté (tentative $attempt/5) — fusion avec la version distante..."
            git fetch origin main || true

            cp docs/feed.json "$RUNNER_TEMP/ours.json"
            if ! git show origin/main:docs/feed.json > "$RUNNER_TEMP/theirs.json" 2>/dev/null; then
              echo '{"items":[]}' > "$RUNNER_TEMP/theirs.json"
            fi

            # On repart de l'état distant, puis la fusion écrit directement
            # dans docs/ : le commit local rejeté est remplacé, jamais
            # rebasé. merge_feed régénère aussi le fichier allégé, pour que
            # les deux restent cohérents.
            git reset --hard origin/main
            if ! python merge_feed.py "$RUNNER_TEMP/theirs.json" "$RUNNER_TEMP/ours.json" docs/feed.json; then
              echo "Fusion impossible — abandon sans écraser le dépôt distant."
              exit 1
            fi
            git add docs/feed.json docs/feed-recent.json
            if git diff --quiet --cached; then
              echo "Le distant contient déjà tout — rien à republier."
              exit 0
            fi
            git commit -m "Mise à jour automatique des flux"

            sleep $((attempt * 3))
          done

          echo "Échec de publication après 5 tentatives."
          exit 1

      # Notification envoyée UNIQUEMENT après une publication réussie.
      # Auparavant elle partait depuis fetch_feeds.py, donc avant le push :
      # un push en échec annonçait sur Discord des articles jamais publiés,
      # que l'exécution suivante redétectait et réannonçait.
      - name: Notifier Discord
        if: success()
        run: python discord_notify.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NEW_ITEMS_FILE: ${{ runner.temp }}/new_items.json
          SOURCE_ALERTS_FILE: ${{ runner.temp }}/source_alerts.json
          PROMOTED_ITEMS_FILE: ${{ runner.temp }}/promoted_items.json

      # Notification push native, en plus de Discord : taper une
      # notification Discord ouvre Discord, jamais l'article. Comme pour
      # Discord, l'envoi n'a lieu qu'APRÈS une publication réussie.
      # Sans les secrets VAPID_PRIVATE_KEY et PUSH_SUBSCRIPTIONS, l'étape
      # ne fait rien.
      - name: Notifier par push
        if: success()
        run: python push_notify.py
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          NEW_ITEMS_FILE: ${{ runner.temp }}/new_items.json
          PROMOTED_ITEMS_FILE: ${{ runner.temp }}/promoted_items.json

      # Signal de vie ("dead man's switch"). C'est l'ABSENCE de ce signal
      # qui déclenche l'alerte, pas sa présence : un robot qui ne tourne
      # plus du tout n'envoie aucun message d'erreur, et c'est précisément
      # le cas qui est passé inaperçu pendant des heures fin août 2026.
      # GitHub n'envoie un mail que si un run échoue — jamais si aucun run
      # ne part.
      #
      # Sans le secret HEALTHCHECK_URL configuré, l'étape ne fait rien.
      - name: Signaler que le robot est vivant
        if: always()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "HEALTHCHECK_URL non configuré — surveillance externe désactivée."
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            CIBLE="$HEALTHCHECK_URL"
            echo "Envoi du signal de vie..."
          else
            CIBLE="$HEALTHCHECK_URL/fail"
            echo "Signalement de l'échec ($JOB_STATUS)..."
          fi
          # Cette étape ne doit jamais faire échouer le job : le travail est
          # déjà publié, une panne du service de surveillance n'est pas une
          # panne du robot.
          curl -fsS -m 10 --retry 3 "$CIBLE" > /dev/null && echo "Signal envoyé." || echo "Signal non envoyé (service injoignable)."
