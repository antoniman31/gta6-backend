name: Mise à jour des flux GTA 6

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer et traiter les flux
        run: python fetch_feeds.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}

      - name: Publier le résultat
        run: |
          git config --global user.name "GTA6 Watch Bot"
          git config --global user.email "actions@github.com"
          git add docs/feed.json
          git diff --quiet --cached || git commit -m "Mise à jour automatique des flux"
          for i in 1 2 3; do
            if git push; then
              break
            fi
            echo "Push rejeté (tentative $i/3), récupération des changements distants..."
            git pull --rebase origin main
          done        run: |
          git config --global user.name "GTA6 Watch Bot"
          git config --global user.email "actions@github.com"
          git add docs/feed.json
          git diff --quiet --cached || git commit -m "Mise à jour automatique des flux"
          git push
