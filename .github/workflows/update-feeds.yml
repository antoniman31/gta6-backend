name: Mise à jour des flux GTA 6

on:
  schedule:
    # Toutes les 3 heures. Modifie cette ligne si tu veux une autre fréquence
    # (ex. "0 */1 * * *" pour toutes les heures — attention à rester dans le
    # quota gratuit, largement suffisant à ce rythme pour un usage perso).
    - cron: "0 */3 * * *"
  workflow_dispatch: # permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer et traiter les flux
        run: python fetch_feeds.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}

      - name: Publier le résultat
        run: |
          git config --global user.name "GTA6 Watch Bot"
          git config --global user.email "actions@github.com"
          git add docs/feed.json
          git diff --quiet --cached || git commit -m "Mise à jour automatique des flux"
          git push
